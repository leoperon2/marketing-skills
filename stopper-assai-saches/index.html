<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Tamaki;src:url(assets/fonts/tamaki-one.otf)}
html,body{margin:0;background:#000}
#s{position:relative;width:384px;height:1920px;overflow:hidden;background:#0e0805 url(assets/bg.png)}
.a{position:absolute;left:0;width:384px;text-align:center;transform-origin:50% 50%}
#selo{top:90px;left:42px;width:300px}
#t1{top:215px;font:400 132px/1 Tamaki;color:#fff;letter-spacing:3px;text-shadow:0 6px 14px rgba(0,0,0,.6)}
#t2{top:345px;font:400 84px/1 Tamaki;color:#fff;letter-spacing:3px;text-shadow:0 5px 12px rgba(0,0,0,.6)}
#t3{top:440px;font:400 84px/1 Tamaki;color:#fff;letter-spacing:3px;text-shadow:0 5px 12px rgba(0,0,0,.6)}
#tag{top:560px;font:400 32px/1.1 "Bebas Neue";color:#d9b36a;letter-spacing:3px;white-space:nowrap;text-shadow:0 3px 6px rgba(0,0,0,.6)}
.e{position:relative;display:inline-block}.e img{position:absolute;width:24px;left:calc(50% - 14.5px);top:-21px}
.pk{position:absolute;width:300px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.6))}
#c{left:22px;top:650px;width:296px}
#g{left:44px;top:1120px;width:288px}
.badge{z-index:5;position:absolute;width:104px;height:104px;border-radius:50%;background:#fff;color:#1a1a1a;font:400 30px/1.05 "Bebas Neue";text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 5px 12px rgba(0,0,0,.5);letter-spacing:.5px}
.badge small{font:400 19px "Bebas Neue";color:#d6101c;letter-spacing:1px}
#bc{left:270px;top:1010px}
#bg{left:30px;top:1490px}
#ben{top:1650px;font:900 22px/1.25 Nunito;color:#f3dc9a;text-shadow:0 3px 8px rgba(0,0,0,.8)}
#ben b{color:#fff}
#logo{left:36px;top:1768px;width:312px}
#shine{position:absolute;top:0;width:60px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);mix-blend-mode:soft-light}
.wrap{position:absolute;overflow:hidden}
</style></head><body>
<div id="s">
 <img id="selo" class="a" src="assets/selo_lancamento.png" style="width:300px">
 <div id="t1" class="a">SACH<span class="e">E<img src="assets/acento.png"></span>S</div>
 <div id="t2" class="a">CANISTER</div>
 <div id="t3" class="a">PREMIUM</div>
 <div id="tag" class="a">MAIS SABOR PARA O SEU PET</div>
 <img id="c" class="pk" src="assets/saches_cao.png">
 <div id="bc" class="badge"><small>PARA CÃES</small>100 g</div>
 <img id="g" class="pk" src="assets/saches_gato.png">
 <div id="bg" class="badge"><small>PARA GATOS</small>85 g</div>
 <div id="ben" class="a"><b>Sem corantes</b><br>com vitaminas e minerais</div>
 <img id="logo" class="a" src="assets/logo_canister.png">
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,d)=>cl((t-a)/d);
const outBack=x=>{const c=2.2,k=c-1;return 1+c*Math.pow(x-1,3)+k*Math.pow(x-1,2)};
const outCubic=x=>1-Math.pow(1-x,3);
function set(el,o,tx=0,ty=0,sc=1,rot=0){el.style.opacity=o;el.style.transform=`translate(${tx}px,${ty}px) scale(${sc}) rotate(${rot}deg)`}
window.setTime=function(t){
  let p=prog(t,.1,.7);set($('selo'),cl(p*4),0,0,.3+.7*outBack(p),-5+(1-p)*-12);
  p=prog(t,.6,.6);set($('t1'),cl(p*4),0,(1-outCubic(p))*-60,.7+.3*outBack(p));
  p=prog(t,.9,.5);set($('t2'),cl(p*4),(1-outCubic(p))*-120,0);
  p=prog(t,1.1,.5);set($('t3'),cl(p*4),(1-outCubic(p))*120,0);
  p=prog(t,1.7,.6);set($('tag'),p,0,(1-outCubic(p))*20);
  // sachê cão
  p=prog(t,2.2,.9);let f=Math.sin(t*1.5)*7;
  set($('c'),cl(p*4),(1-outBack(p))*-380,(p>=1?f:0),1,-7+(1-p)*-25+(p>=1?Math.sin(t*1.5)*1.5:0));
  p=prog(t,3.2,.45);set($('bc'),cl(p*3),0,(p>=1?f*.5:0),.2+.8*outBack(p),8);
  // sachê gato
  p=prog(t,4.2,.9);f=Math.sin(t*1.5+2)*7;
  set($('g'),cl(p*4),(1-outBack(p))*380,(p>=1?f:0),1,7+(1-p)*25+(p>=1?Math.sin(t*1.5+2)*1.5:0));
  p=prog(t,5.2,.45);set($('bg'),cl(p*3),0,(p>=1?f*.5:0),.2+.8*outBack(p),-8);
  p=prog(t,6.5,.6);set($('ben'),p,0,(1-outCubic(p))*25);
  p=prog(t,7.2,.5);set($('logo'),cl(p*3),0,0,.6+.4*outBack(p));
  if(t>9){const k=1+.045*Math.max(0,Math.sin((t-9)*3.2));$('logo').style.transform+=` scale(${k})`}
  if(t>8){const k=1+.03*Math.max(0,Math.sin((t-8)*2.4));$('selo').style.transform+=` scale(${k})`}
}
document.fonts.ready.then(()=>{window.ready=true});
</script></body></html>
