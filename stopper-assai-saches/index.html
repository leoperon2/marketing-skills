<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Tamaki;src:url(assets/fonts/tamaki-one.otf)}
html,body{margin:0;background:#000}
#s{position:relative;width:384px;height:1920px;overflow:hidden;background:#0e0805}
#bgm{position:absolute;left:0;top:0;width:480px;height:1920px;background:url(assets/bg.png) 0 0/100% 100%;will-change:transform}
.dust{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,196,120,.9),rgba(255,160,70,0) 70%);pointer-events:none}
.star{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 4px #fff);pointer-events:none;opacity:0}
.a{position:absolute;left:0;width:384px;text-align:center;transform-origin:50% 50%}
#selo{top:90px;left:42px;width:300px}
.tl{font-family:Tamaki;font-weight:400;line-height:1;color:transparent;white-space:nowrap;filter:drop-shadow(0 5px 10px rgba(0,0,0,.6));left:0;width:384px;background:linear-gradient(100deg,#fff 40%,#ffe08a 50%,#fff 60%) 100% 0/300% 100%;-webkit-background-clip:text;background-clip:text}
#tag{top:560px;font:400 32px/1.1 "Bebas Neue";color:transparent;letter-spacing:3px;white-space:nowrap;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));background:linear-gradient(100deg,#d9b36a 40%,#fff6cf 50%,#d9b36a 60%) 100% 0/300% 100%;-webkit-background-clip:text;background-clip:text}
#acc{position:absolute;width:24px;height:auto}
.pk{position:absolute;width:300px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.6))}
.pk img{width:100%;display:block}
.psh{position:absolute;left:0;top:0;width:100%;height:100%;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 58%) 100% 0/300% 100%}
#c{left:22px;top:650px;width:296px}
#g{left:44px;top:1120px;width:288px}
#ben{text-shadow:0 2px 6px #000,0 0 14px rgba(0,0,0,.9);top:1650px;font:900 22px/1.25 Nunito;color:#f3dc9a;text-shadow:0 3px 8px rgba(0,0,0,.8)}
#ben b{color:#fff}
#logo{left:36px;top:1768px;width:312px}
#shine{position:absolute;top:0;width:60px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);mix-blend-mode:soft-light}
.wrap{position:absolute;overflow:hidden}
</style></head><body>
<div id="s">
 <div id="bgm"></div><div id="dust"></div>
 <img id="selo" class="a" src="assets/selo_lancamento.png" style="width:300px">
 <div id="t1" class="a tl">SACH<span class="e">E</span>S<img id="acc" src="assets/acento.png"></div>
 <div id="t2" class="a tl">CANISTER</div>
 <div id="t3" class="a tl">PREMIUM</div>
 <div id="tag" class="a">MAIS SABOR PARA O SEU PET</div>
 <div id="c" class="pk"><img src="assets/saches_cao.png"><div class="psh" style="-webkit-mask-image:url(assets/saches_cao.png);mask-image:url(assets/saches_cao.png)"></div></div>
 <div id="g" class="pk"><img src="assets/saches_gato.png"><div class="psh" style="-webkit-mask-image:url(assets/saches_gato.png);mask-image:url(assets/saches_gato.png)"></div></div>
 <div id="scrim" class="a" style="top:1590px;height:170px;background:linear-gradient(180deg,rgba(8,4,2,0),rgba(8,4,2,.78) 35%,rgba(8,4,2,.78) 65%,rgba(8,4,2,0))"></div>
 <div id="ben" class="a"><b>Sem corantes</b><br>com vitaminas e minerais</div>
 <img id="logo" class="a" src="assets/logo_canister.png">
 <div id="stars"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,d)=>cl((t-a)/d);
const outBack=x=>{const c=2.2,k=c-1;return 1+c*Math.pow(x-1,3)+k*Math.pow(x-1,2)};
const outCubic=x=>1-Math.pow(1-x,3);
function set(el,o,tx=0,ty=0,sc=1,rot=0){el.style.opacity=o;el.style.transform=`translate(${tx}px,${ty}px) scale(${sc}) rotate(${rot}deg)`}
window.setTime=function(t){
  fx(t);
  let p=prog(t,.1,.7);set($('selo'),cl(p*4),0,0,.3+.7*outBack(p),-5+(1-p)*-12);
  p=prog(t,.6,.6);set($('t1'),cl(p*4),0,(1-outCubic(p))*-60,.7+.3*outBack(p));
  p=prog(t,.9,.5);set($('t2'),cl(p*4),(1-outCubic(p))*-120,0);
  p=prog(t,1.1,.5);set($('t3'),cl(p*4),(1-outCubic(p))*120,0);
  p=prog(t,1.7,.6);set($('tag'),p,0,(1-outCubic(p))*20);
  // sachê cão  (entra de 2.2 a 3.1; o balanço parte de zero na aterrissagem)
  const sm=x=>x*x*(3-2*x);
  p=prog(t,2.2,.9);let w=sm(prog(t,3.1,1.0)), ph=(t-3.1)*1.5;
  set($('c'),cl(p*4),(1-outBack(p))*-380,Math.sin(ph)*7*w,1,-7+(1-p)*-25+Math.sin(ph)*1.5*w);
  // sachê gato  (entra de 4.2 a 5.1)
  p=prog(t,4.2,.9);w=sm(prog(t,5.1,1.0));ph=(t-5.1)*1.5;
  set($('g'),cl(p*4),(1-outBack(p))*380,Math.sin(ph)*7*w,1,7+(1-p)*25+Math.sin(ph)*1.5*w);
  p=prog(t,6.5,.6);set($('ben'),p,0,(1-outCubic(p))*25);set($('scrim'),p);
  p=prog(t,7.2,.5);set($('logo'),cl(p*3),0,0,.6+.4*outBack(p));
  if(t>9){const k=1+.045*Math.max(0,Math.sin((t-9)*3.2));$('logo').style.transform+=` scale(${k})`}
  if(t>8){const k=1+.03*Math.max(0,Math.sin((t-8)*2.4));$('selo').style.transform+=` scale(${k})`}
}


const STARS=[[336,236,1.6,0],[34,338,1.2,.7],[322,470,1.4,1.4],[352,130,1.0,2.1],[300,690,1.3,.3],[40,1180,1.2,1.1],[330,1330,1.4,1.9],[46,1500,1.0,.5],[96,1000,1.1,2.4]];
const DUST=[];for(let i=0;i<16;i++){const r=(n)=>{const x=Math.sin(i*97.1+n*13.7)*43758.5;return x-Math.floor(x)};DUST.push({x:r(1)*384,y:r(2)*1920,sp:12+r(3)*22,sz:3+r(4)*6,ph:r(5)*6.28,op:.25+r(6)*.35})}
function buildFx(){
  const d=$('dust'),st=$('stars');
  DUST.forEach(p=>{const e=document.createElement('div');e.className='dust';e.style.width=e.style.height=p.sz+'px';d.appendChild(e);p.el=e});
}
function fx(t){
  // background: slow push-in + drift, plus rising warm dust
  const u=t/15, e=u*u*(3-2*u)*.35+u*.65;   // deslize lateral bem lento, suavizado nas pontas
  $('bgm').style.transform=`translate(${-96*e}px,0)`;
  DUST.forEach(p=>{const y=((p.y-t*p.sp)%1920+1920)%1920;p.el.style.transform=`translate(${p.x+Math.sin(t*.6+p.ph)*14}px,${y}px)`;p.el.style.opacity=p.op*(.6+.4*Math.sin(t*1.3+p.ph))});
  // text shine: sweeps line by line, repeating
  [['t1',0],['t2',.22],['t3',.44],['tag',.8]].forEach(([id,off])=>{
    const ph=((t-2.2-off)%4+4)%4/1.3; const X=ph<1?100-85*ph*1.15+0:100;   // 100 = parked off-left
    $(id).style.backgroundPosition=(t<2.2?100:Math.max(15,Math.min(100,X)))+'% 0';
  });
  // pack shine
  [['c',3.3],['g',5.3]].forEach(([id,t0])=>{
    const ph=((t-t0)%4+4)%4/1.2, X=(t<t0?100:ph<1?100-85*ph:100);
    document.querySelector('#'+id+' .psh').style.backgroundPosition=X+'% 0';
  });
}

const BLOCK_W=332, TRACK=.025, GAP_K=.245, TOP=222;
function layout(){
  const c=document.createElement('canvas').getContext('2d');
  let y=TOP, firstFs=0;
  ['t1','t2','t3'].forEach((id,i)=>{
    const el=$(id), txt=el.textContent.replace(/v$/,'');
    const probe=document.createElement('span'); probe.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:400 100px Tamaki;letter-spacing:'+(TRACK*100)+'px';
    probe.textContent=i==0?'SACHES':txt; document.body.appendChild(probe);
    const w100=probe.getBoundingClientRect().width-TRACK*100; probe.remove();
    const fs=100*BLOCK_W/w100; if(i==0) firstFs=fs;
    el.style.fontSize=fs+'px'; el.style.letterSpacing=(TRACK*fs)+'px'; el.style.textIndent=(TRACK*fs)+'px';
    c.font='400 '+fs+'px Tamaki';
    const m=c.measureText('H'), capH=m.actualBoundingBoxAscent;
    const fa=m.fontBoundingBoxAscent, fd=m.fontBoundingBoxDescent;
    const base=(fs-(fa+fd))/2+fa;           // baseline inside the line box
    el.style.top=(y-(base-capH))+'px';       // cap top lands at y
    y+=capH+GAP_K*capH;
    if(i==2) window.blockBottom=y-GAP_K*capH;
  });
  const k=firstFs/132, img=$('acc'), t1=$('t1'), er=document.querySelector('.e').getBoundingClientRect();
  img.style.width=(24*k)+'px';
  img.style.left=(er.left+er.width/2-14.5*k)+'px';
  img.style.top=((TOP-t1.offsetTop)-26*k)+'px';
  const tg=$('tag'), pr=document.createElement('span');
  pr.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:400 100px "Bebas Neue";letter-spacing:10px';
  pr.textContent=tg.textContent; document.body.appendChild(pr);
  const tw=pr.getBoundingClientRect().width-10; pr.remove();
  const tf=100*BLOCK_W/tw; tg.style.fontSize=tf+'px'; tg.style.letterSpacing=(tf*.1)+'px'; tg.style.textIndent=(tf*.1)+'px';
  tg.style.top=(window.blockBottom+30)+'px';
}
document.fonts.ready.then(()=>{layout();buildFx();window.ready=true});
</script></body></html>
